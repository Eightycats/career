<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Path</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <header class="site-header">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <h1 id="site-title">Matt Jensen</h1>
      <p id="site-intro" class="intro">Loading…</p>
    </header>

    <section class="trail-wrap" aria-label="Career timeline">
      <svg class="trail-svg" viewBox="0 0 100 1000" preserveAspectRatio="none" aria-hidden="true">
        <path class="dirt-path-shadow"
          d="M50 0 C15 90 85 165 54 245 C28 320 20 390 59 470 C92 545 70 625 42 700 C12 780 84 855 52 1000" />
        <path class="dirt-path"
          d="M50 0 C15 90 85 165 54 245 C28 320 20 390 59 470 C92 545 70 625 42 700 C12 780 84 855 52 1000" />
      </svg>

      <div class="tree tree-1"></div>
      <div class="tree tree-2"></div>
      <div class="tree tree-3"></div>
      <div class="tree tree-4"></div>
      <div class="tree tree-5"></div>
      <div class="tree tree-6"></div>

      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <a class="linkedin-float" href="https://www.linkedin.com/in/mattjensen/" target="_blank" rel="noreferrer"
    aria-label="Matt Jensen on LinkedIn">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M20.45 20.45h-3.56v-5.58c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.44-2.13 2.94v5.68H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12Zm1.78 13.02H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z" />
    </svg>
  </a>

  <template id="project-template">
    <article class="project-card">
      <div class="hero-shell">
        <div class="media-stack">
          <div class="primary-media-wrap">
            <a class="primary-media-link" href="#" target="_blank" rel="noreferrer">
              <img class="primary-media" alt="" />
            </a>
          </div>
          <div class="thumb-grid"></div>
        </div>
      </div>
      <div class="project-copy">
        <p class="period"></p>
        <div class="project-header">
          <a class="logo-link" href="#" target="_blank" rel="noreferrer">
            <img class="company-logo" alt="" />
          </a>
          <div class="heading-block">
            <a class="copy-link title-link" href="#" target="_blank" rel="noreferrer">
              <h2></h2>
            </a>
            <a class="copy-link description-link" href="#" target="_blank" rel="noreferrer">
              <p class="description"></p>
            </a>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script>
    async function loadCareer() {
      const response = await fetch("career.json", { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load career.json");
      return response.json();
    }

    function hideLink(anchor) {
      const fragment = document.createDocumentFragment();
      while (anchor.firstChild) fragment.appendChild(anchor.firstChild);
      anchor.replaceWith(fragment);
    }

    function normalizeImages(project) {
      if (Array.isArray(project.projectImages) && project.projectImages.length > 0) {
        return project.projectImages.map((entry) => {
          if (typeof entry === 'string') return { src: entry, alt: `${project.name} project image` };
          return {
            src: entry.src || entry.image || '',
            alt: entry.alt || `${project.name} project image`,
            aspect: entry.aspect || '',
            url: entry.url || '',
            links: entry.links || null
          };
        }).filter(Boolean);
      }
      if (project.heroImage) {
        return [{ src: project.heroImage, alt: `${project.name} hero image` }];
      }
      return [];
    }

    function imageShape(image) {
      const [width, height] = String(image.aspect || '').split('/').map((value) => Number(value.trim()));
      if (!width || !height) return '';
      const ratio = width / height;
      if (ratio >= 1.35) return 'image-card-wide';
      if (ratio <= 0.9) return 'image-card-portrait';
      return 'image-card-square';
    }

    function prepareImageCard(card, image) {
      card.classList.add('image-card');
      if (image.aspect) card.style.setProperty('--card-ratio', image.aspect);
      const shape = imageShape(image);
      if (shape) card.classList.add(shape);
    }

    function allImagesWide(images) {
      return images.length > 1 && images.every((image) => imageShape(image) === 'image-card-wide');
    }

    function deviceStore() {
      const agent = navigator.userAgent || '';
      const platform = navigator.platform || '';
      const hasTouch = navigator.maxTouchPoints > 1;
      if (/android/i.test(agent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(agent)) return 'apple';
      if (/Mac/i.test(platform) && hasTouch) return 'apple';
      return 'apple';
    }

    function imageLink(image, fallbackUrl) {
      if (!image.links) return image.url || fallbackUrl || '';
      const store = deviceStore();
      return image.links[store] || image.links.apple || image.links.android || image.url || fallbackUrl || '';
    }

    function renderProject(project, index) {
      const template = document.getElementById("project-template");
      const node = template.content.firstElementChild.cloneNode(true);
      node.classList.add(index % 2 === 0 ? "from-left" : "from-right");

      node.querySelector('.period').textContent = project.period || '';
      node.querySelector('h2').textContent = project.name || 'Untitled Project';
      node.querySelector('.description').textContent = project.description || '';

      const images = normalizeImages(project);
      const heroShell = node.querySelector('.hero-shell');
      if (images.length > 0) {
        if (Array.isArray(project.projectImages) && project.projectImages.length > 0) {
          node.classList.add('project-gallery');
          if (allImagesWide(images)) node.classList.add('gallery-wide-stack');
        }
        const primary = images[0];
        const primaryImg = node.querySelector('.primary-media');
        const primaryLink = node.querySelector('.primary-media-link');
        const primaryWrap = node.querySelector('.primary-media-wrap');
        prepareImageCard(primaryWrap, primary);
        primaryImg.src = primary.src;
        primaryImg.alt = primary.alt;
        const primaryHref = imageLink(primary, project.url);
        if (primaryHref) primaryLink.href = primaryHref; else hideLink(primaryLink);

        const thumbGrid = node.querySelector('.thumb-grid');
        images.slice(1).forEach((image) => {
          const href = imageLink(image, project.url);
          const wrap = document.createElement(href ? 'a' : 'div');
          wrap.className = 'thumb-card';
          prepareImageCard(wrap, image);
          if (href) {
            wrap.href = href;
            wrap.target = '_blank';
            wrap.rel = 'noreferrer';
          }
          const img = document.createElement('img');
          img.className = 'thumb-image';
          img.src = image.src;
          img.alt = image.alt;
          wrap.appendChild(img);
          thumbGrid.appendChild(wrap);
        });
        if (images.length <= 1) thumbGrid.remove();
      } else {
        node.classList.add('no-hero');
        heroShell.remove();
      }

      const logoImg = node.querySelector('.company-logo');
      const logoLink = node.querySelector('.logo-link');
      const companyLogo = project.companyLogo || project.logoImage || '';
      if (companyLogo) {
        logoImg.src = companyLogo;
        logoImg.alt = `${project.name || 'Company'} logo`;
        if (project.url) logoLink.href = project.url; else hideLink(logoLink);
      } else {
        logoLink.remove();
      }

      const titleLink = node.querySelector('.title-link');
      const descLink = node.querySelector('.description-link');
      if (project.url) {
        titleLink.href = project.url;
        descLink.href = project.url;
      } else {
        hideLink(titleLink);
        hideLink(descLink);
      }

      return node;
    }

    function setupRevealAnimation() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.2 });
      document.querySelectorAll('.project-card').forEach(card => observer.observe(card));
    }

    loadCareer()
      .then(data => {
        document.title = data.siteTitle || 'Career Path';
        document.getElementById('site-title').textContent = data.siteTitle || 'Career Path';
        document.getElementById('site-intro').textContent = data.intro || '';
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        (data.projects || []).forEach((project, index) => timeline.appendChild(renderProject(project, index)));
        setupRevealAnimation();
      })
      .catch(error => {
        document.getElementById('site-intro').textContent = 'Could not load career.json. Make sure you are serving this folder with a local web server.';
        console.error(error);
      });
  </script>
</body>

</html>
