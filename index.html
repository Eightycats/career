<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Path</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <header class="site-header">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <h1 id="site-title">Matt Jensen</h1>
      <p id="site-intro" class="intro">Loading…</p>
    </header>

    <section class="trail-wrap" aria-label="Career timeline">
      <svg class="trail-svg" viewBox="0 0 100 1000" preserveAspectRatio="none" aria-hidden="true">
        <path class="dirt-path-shadow"
          d="M50 0 C15 90 85 165 54 245 C28 320 20 390 59 470 C92 545 70 625 42 700 C12 780 84 855 52 1000" />
        <path class="dirt-path"
          d="M50 0 C15 90 85 165 54 245 C28 320 20 390 59 470 C92 545 70 625 42 700 C12 780 84 855 52 1000" />
      </svg>

      <div class="tree tree-1"></div>
      <div class="tree tree-2"></div>
      <div class="tree tree-3"></div>
      <div class="tree tree-4"></div>
      <div class="tree tree-5"></div>
      <div class="tree tree-6"></div>

      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <a class="linkedin-float" href="https://www.linkedin.com/in/mattjensen/" target="_blank" rel="noreferrer"
    aria-label="Matt Jensen on LinkedIn">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M20.45 20.45h-3.56v-5.58c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.44-2.13 2.94v5.68H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12Zm1.78 13.02H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z" />
    </svg>
  </a>

  <script>
    async function loadCareer() {
      const response = await fetch("career.json", { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load career.json");
      return response.json();
    }

    function hideLink(anchor) {
      const fragment = document.createDocumentFragment();
      while (anchor.firstChild) fragment.appendChild(anchor.firstChild);
      anchor.replaceWith(fragment);
    }

    function normalizeImages(project) {
      if (Array.isArray(project.projectImages) && project.projectImages.length > 0) {
        return project.projectImages.map((entry) => {
          if (typeof entry === 'string') return { src: entry, alt: `${project.name} project image` };
          return {
            src: entry.src || entry.image || '',
            alt: entry.alt || `${project.name} project image`,
            aspect: entry.aspect || '',
            url: entry.url || '',
            links: entry.links || null
          };
        }).filter(Boolean);
      }
      if (project.heroImage) {
        return [{ src: project.heroImage, alt: `${project.name} hero image` }];
      }
      return [];
    }

    function deviceStore() {
      const agent = navigator.userAgent || '';
      const platform = navigator.platform || '';
      const hasTouch = navigator.maxTouchPoints > 1;
      if (/android/i.test(agent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(agent)) return 'apple';
      if (/Mac/i.test(platform) && hasTouch) return 'apple';
      return 'apple';
    }

    function imageLink(image, fallbackUrl) {
      if (!image.links) return image.url || fallbackUrl || '';
      const store = deviceStore();
      return image.links[store] || image.links.apple || image.links.android || image.url || fallbackUrl || '';
    }

    // Per-project hardcoded fan layouts.
    // sceneHeight: fan-area height in px on desktop. Cards must fit within it.
    // Cards: widthPct = % of fan-area width; aspect = "W/H"; top/left = % of fan-area.
    //   When fromRight, left values are mirrored to right (so cards always hug the copy side).
    const FAN_CONFIGS = {
      "Limit Break": {
        // 2 wide landscape images: hero big on left, stadium tucked behind-right
        sceneHeight: 460,
        cards: [
          { widthPct: 68, aspect: "1000/375", rotate: -4, top: "8%",  left: "2%",  zIndex: 3 },
          { widthPct: 62, aspect: "1000/382", rotate:  5, top: "30%", left: "20%", zIndex: 2 },
        ]
      },
      "Machine Zone": {
        // 3 portrait cards splayed like a hand. All hug the left (copy) side.
        sceneHeight: 500,
        cards: [
          { widthPct: 25, aspect: "250/385",  rotate: -11, top: "4%",  left: "2%",  zIndex: 4 },
          { widthPct: 25, aspect: "250/385",  rotate:   0, top: "1%",  left: "23%", zIndex: 3 },
          { widthPct: 25, aspect: "735/1100", rotate:  11, top: "4%",  left: "44%", zIndex: 2 },
        ]
      },
      "SEGA Networks": {
        // Nadder card big, Puyo tucked behind. Both wide/square, hug left.
        sceneHeight: 460,
        cards: [
          { widthPct: 62, aspect: "1000/752",  rotate: -3, top: "6%",  left: "2%",  zIndex: 3 },
          { widthPct: 46, aspect: "1448/1086", rotate:  7, top: "20%", left: "36%", zIndex: 2 },
        ]
      },
      "Three Rings": {
        // Single Puzzle Pirates wide card. Hug the copy side.
        // At 850px fanArea: 60% = 510px. H = 510 / (600/438) = 372px. Top 5% = 24px. Bottom = 396px < 460px. ✓
        sceneHeight: 460,
        cards: [
          { widthPct: 60, aspect: "600/438", rotate: -2, top: "6%", left: "4%", zIndex: 2 },
        ]
      },
      "Perpetual Entertainment": {
        // Natural from-right (index 5). Fan LEFT, copy RIGHT.
        // left value is mirrored to right: left:"5%" → right:"5%" = card hugs copy on right side.
        sceneHeight: 480,
        cards: [
          { widthPct: 40, aspect: "352/500", rotate: 3, top: "5%", left: "5%", zIndex: 2 },
        ]
      },
    };

    function aspectRatio(str) {
      const [w, h] = str.split('/').map(Number);
      return w / h;
    }

    function buildFanArea(images, project, fromRight) {
      const cfg = FAN_CONFIGS[project.name];
      const fanArea = document.createElement('div');
      fanArea.className = 'fan-area';

      if (!cfg) return fanArea;

      // --scene-h drives desktop height via CSS; mobile ignores it (height: auto)
      fanArea.style.setProperty('--scene-h', cfg.sceneHeight + 'px');

      cfg.cards.forEach((cardCfg, i) => {
        const image = images[i];
        if (!image) return;

        const href = imageLink(image, project.url);
        const card = document.createElement('div');
        card.className = 'fan-card';

        const ratio = aspectRatio(cardCfg.aspect);
        if (ratio >= 1.35) card.classList.add('fan-card-wide');
        else if (ratio <= 0.9) card.classList.add('fan-card-portrait');
        else card.classList.add('fan-card-square');

        // CSS custom properties: desktop CSS reads these for absolute positioning.
        // Mobile CSS overrides position/size with shape classes and ignores these.
        card.style.setProperty('--fan-ar',  ratio);
        card.style.setProperty('--fan-rot', cardCfg.rotate + 'deg');
        card.style.setProperty('--fan-w',   cardCfg.widthPct + '%');
        card.style.setProperty('--fan-top', cardCfg.top);
        card.style.setProperty('--fan-z',   cardCfg.zIndex);
        // Mirror left→right when fan is on left side (fromRight cards)
        if (fromRight) {
          card.style.setProperty('--fan-left',  'auto');
          card.style.setProperty('--fan-right', cardCfg.left);
        } else {
          card.style.setProperty('--fan-left',  cardCfg.left);
          card.style.setProperty('--fan-right', 'auto');
        }

        // z-index boost on hover (desktop only — touch devices don't fire mouseenter)
        card.addEventListener('mouseenter', () => card.style.setProperty('--fan-z', '20'));
        card.addEventListener('mouseleave', () => card.style.setProperty('--fan-z', cardCfg.zIndex));

        const inner = href ? document.createElement('a') : document.createElement('div');
        inner.style.cssText = 'display:block;width:100%;height:100%;';
        if (href) { inner.href = href; inner.target = '_blank'; inner.rel = 'noreferrer'; }
        const img = document.createElement('img');
        img.src = image.src;
        img.alt = image.alt;
        img.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;';
        inner.appendChild(img);
        card.appendChild(inner);
        fanArea.appendChild(card);
      });

      return fanArea;
    }

    function renderProject(project, index) {
      const fromRight = index % 2 !== 0;
      const article = document.createElement('article');
      article.className = 'project-card ' + (fromRight ? 'from-right' : 'from-left');

      const images = normalizeImages(project);

      // Copy panel
      const copy = document.createElement('div');
      copy.className = 'project-copy';

      const period = document.createElement('p');
      period.className = 'period';
      period.textContent = project.period || '';
      copy.appendChild(period);

      const header = document.createElement('div');
      header.className = 'project-header';

      const companyLogo = project.companyLogo || project.logoImage || '';
      if (companyLogo) {
        const logoLink = document.createElement('a');
        logoLink.className = 'logo-link';
        if (project.url) { logoLink.href = project.url; logoLink.target = '_blank'; logoLink.rel = 'noreferrer'; }
        const logoImg = document.createElement('img');
        logoImg.className = 'company-logo';
        logoImg.src = companyLogo;
        logoImg.alt = `${project.name || 'Company'} logo`;
        logoLink.appendChild(logoImg);
        header.appendChild(logoLink);
      }

      const headingBlock = document.createElement('div');
      headingBlock.className = 'heading-block';

      const titleLink = document.createElement('a');
      titleLink.className = 'copy-link title-link';
      if (project.url) { titleLink.href = project.url; titleLink.target = '_blank'; titleLink.rel = 'noreferrer'; }
      const h2 = document.createElement('h2');
      h2.textContent = project.name || 'Untitled Project';
      titleLink.appendChild(h2);
      headingBlock.appendChild(titleLink);
      header.appendChild(headingBlock);

      // Description is a full-width row below logo+title
      const descLink = document.createElement('a');
      descLink.className = 'copy-link description-link';
      descLink.style.cssText = 'width:100%;flex-basis:100%;';
      if (project.url) { descLink.href = project.url; descLink.target = '_blank'; descLink.rel = 'noreferrer'; }
      const desc = document.createElement('p');
      desc.className = 'description';
      desc.style.margin = '0';
      desc.textContent = project.description || '';
      descLink.appendChild(desc);
      header.appendChild(descLink);

      copy.appendChild(header);

      const scene = document.createElement('div');
      scene.className = 'card-scene';

      if (images.length === 0) {
        article.classList.add('no-hero');
        scene.appendChild(copy);
      } else {
        const fanArea = buildFanArea(images, project, fromRight);
        // fanArea always first in DOM so mobile (column layout) shows hero ABOVE company card.
        // Desktop CSS uses row-reverse for from-left to visually put copy on the left.
        scene.appendChild(fanArea);
        scene.appendChild(copy);
      }

      article.appendChild(scene);

      return article;
    }

    function setupRevealAnimation() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.project-card').forEach(card => observer.observe(card));
    }

    loadCareer()
      .then(data => {
        document.title = data.siteTitle || 'Career Path';
        document.getElementById('site-title').textContent = data.siteTitle || 'Career Path';
        document.getElementById('site-intro').textContent = data.intro || '';
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        (data.projects || []).forEach((project, index) => timeline.appendChild(renderProject(project, index)));
        setupRevealAnimation();
      })
      .catch(error => {
        document.getElementById('site-intro').textContent = 'Could not load career.json. Make sure you are serving this folder with a local web server.';
        console.error(error);
      });
  </script>
</body>

</html>
